---
ukiryu_schema: '1.0'
name: gl
display_name: GitLab CLI
homepage: https://gitlab.com/gitlab-org/cli
version: '1.35'
aliases: []
version_detection:
  command: "--version"
  pattern: gl version (\d+\.\d+)
  modern_threshold: '1.0'
search_paths:
implements: gl/1.0
execution_profiles:
- name: default
  platforms:
  - macos
  - linux
  - windows
  shells:
  - bash
  - zsh
  - fish
  - sh
  - powershell
  - windows
  option_style: double_dash_space
  executable_name: gl
  commands:
  - name: repo_ls
    display_name: List repositories
    description: List GitLab repositories
    subcommand: repo
    arguments:
    - name: owner
      type: string
      required: false
      position: 1
      description: Owner path (default is current user)
    options:
    - name: visibility
      type: symbol
      cli: "--visibility"
      values:
      - public
      - private
      - internal
      description: Repository visibility
    - name: page
      type: integer
      cli: "--page"
      description: Target page number
    - name: per_page
      type: integer
      cli: "--per-page"
      description: Per page data number
    - name: owned
      cli: "--owned"
      type: boolean
      description: User-owned repositories only
    - name: json
      cli: "--json"
      short: "-j"
      type: boolean
      description: Output raw JSON data
    flags:
    - name: help
      cli: "--help"
      short: "-h"
      description: Show help documentation
  - name: mr_list
    display_name: List merge requests
    description: List merge requests
    subcommand: mr
    options:
    - name: repo
      type: string
      cli: "--repo"
      description: Target repository
    - name: state
      type: symbol
      cli: "--state"
      values:
      - opened
      - closed
      - locked
      - merged
      description: Filter by state
    - name: json
      cli: "--json"
      short: "-j"
      type: boolean
      description: Output raw JSON data
    flags:
    - name: help
      cli: "--help"
      short: "-h"
      description: Show help documentation
