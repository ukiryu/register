---
ukiryu_schema: '1.0'
name: awk
version: '5.3'
interface: awk
implementation: gnu

profiles:
  - name: default
    platforms: [macos, linux]
    shells: [unix]
    commands:
      - name: print
        execute: ["awk", "{print}"]
        description: "Print lines"
      - name: pattern
        execute: ["awk", "/pattern/"]
        description: "Match pattern"
