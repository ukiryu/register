---
ukiryu_schema: '1.0'
name: awk
interface: awk
implementations:
- name: gnu
  display_name: GNU awk (gawk)
  homepage: https://www.gnu.org/software/gawk/
  detection:
    executable: awk
    command:
    - "--version"
    pattern: GNU Awk ([\d.]+)
  version_scheme: semantic
  versions:
  - equals: 5.3.0
    file: 5.3.yaml
  - after: 5.0.0
    file: 5.3.yaml
  default: 5.3.yaml
- name: busybox
  display_name: BusyBox awk
  homepage: https://busybox.net/
  detection:
    executable: awk
    command:
    - "--help"
    pattern: BusyBox v([\d.]+)
  version_scheme: semantic
  versions:
  - equals: 1.36.1
    file: 1.36.1.yaml
  - after: 1.35.0
    file: 1.36.1.yaml
  default: 1.36.1.yaml
