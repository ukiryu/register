---
ukiryu_schema: '1.0'
name: gzip
version: '1.12'
interface: gzip
implementation: gnu

profiles:
  - name: default
    platforms: [macos, linux]
    shells: [unix]
    commands:
      - name: compress
        execute: ["gzip"]
        description: "Compress file"
      - name: decompress
        execute: ["gzip", "-d"]
        description: "Decompress file"
