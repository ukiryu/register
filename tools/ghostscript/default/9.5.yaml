---
ukiryu_schema: '1.0'
name: ghostscript
display_name: Ghostscript Interpreter
homepage: https://www.ghostscript.com/
version: '9.5'
aliases:
- gs
- gswin64c
- gswin32c
version_detection:
  command: "--version"
  pattern: "(\\d+\\.\\d+)"
search_paths:
implements: ghostscript/1.0
execution_profiles:
- name: unix
  platforms:
  - macos
  - linux
  shells:
  - bash
  - zsh
  - fish
  - sh
  - powershell
  option_style: single_dash_space
  executable_name: ghostscript
  commands:
  - description: Convert PostScript to PDF or other formats
    usage: gs [OPTIONS] input.ps
    arguments:
    - name: inputs
      type: file
      variadic: true
      position: last
      min: 1
      description: Input file(s)
    options:
    - name: device
      type: symbol
      cli: "-sDEVICE"
      values:
      - pdfwrite
      - eps2write
      - png16m
      - png256
      - pnggray
      - jpeg
      description: Output device
      assignment_delimiter: equals
    - name: output
      type: file
      cli: "-sOutputFile"
      description: Output file
      assignment_delimiter: equals
    - name: resolution
      type: array
      of: integer
      size:
      - 1
      - 2
      cli: "-r"
      separator: x
      description: Resolution (e.g., 300 or 300x600)
      assignment_delimiter: space
    - name: lib_paths
      type: array
      of: file
      cli: "-I"
      separator: " "
      description: Library search paths
      assignment_delimiter: space
    flags:
    - name: safer
      cli: "-dSAFER"
      description: Run in safer mode
      default: true
      assignment_delimiter: none
    - name: quiet
      cli: "-q"
      description: Suppress informational messages
      default: false
      assignment_delimiter: none
    - name: batch
      cli: "-dBATCH"
      description: Run in batch mode
      default: true
      assignment_delimiter: none
    - name: nopause
      cli: "-dNOPAUSE"
      description: Don't pause per page
      default: true
      assignment_delimiter: none
    - name: eps_crop
      cli: "-dEPSCrop"
      description: Automatically crop EPS bounding box
      default: false
      assignment_delimiter: none
    name: convert
- name: windows
  platforms:
  - windows
  shells:
  - bash
  - powershell
  - windows
  option_style: single_dash_space
  executable_name: ghostscript
  commands: []
