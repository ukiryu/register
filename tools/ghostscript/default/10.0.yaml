---
ukiryu_schema: '1.0'
name: ghostscript
display_name: Ghostscript PS/PDF Interpreter
homepage: https://www.ghostscript.com/
version: '10.0'
aliases:
- gs
- ghostscript
version_detection:
  command: "--version"
  pattern: "(\\d+\\.\\d+)"
  modern_threshold: '9.0'
search_paths:
implements: ghostscript/1.0
execution_profiles:
- name: unix
  platforms:
  - macos
  - linux
  shells:
  - bash
  - zsh
  - fish
  - sh
  option_style: single_dash_equals
  executable_name: ghostscript
  commands:
  - description: Convert PostScript or PDF to other formats
    usage: gs [options] input-file
    arguments:
    - name: inputs
      type: file
      variadic: true
      min: 1
      position: last
      description: Input file(s) to process
    options:
    - name: device
      type: string
      cli: "-sDEVICE"
      description: Output device (e.g., png16m, jpeg, pdfwrite)
      assignment_delimiter: equals
    - name: output
      type: file
      cli: "-sOutputFile"
      description: Output file path
      assignment_delimiter: equals
    - name: resolution
      type: string
      cli: "-r"
      description: Resolution (e.g., 150, 300, or 600x600)
      assignment_delimiter: auto
    - name: first_page
      type: integer
      cli: "-dFirstPage"
      description: First page to process
      assignment_delimiter: equals
    - name: last_page
      type: integer
      cli: "-dLastPage"
      description: Last page to process
      assignment_delimiter: equals
    - name: pdf_settings
      type: string
      cli: "-dPDFSETTINGS"
      values:
      - screen
      - ebook
      - printer
      - prepress
      - default
      description: PDF preset settings
      assignment_delimiter: equals
    - name: quality
      type: integer
      cli: "-dJPEGQ"
      range:
      - 1
      - 100
      description: JPEG quality (1-100)
      assignment_delimiter: equals
    - name: text_alpha
      type: integer
      cli: "-dTextAlphaBits"
      range:
      - 1
      - 4
      description: Text anti-aliasing (1=no AA, 4=best)
      assignment_delimiter: equals
    - name: graphics_alpha
      type: integer
      cli: "-dGraphicsAlphaBits"
      range:
      - 1
      - 4
      description: Graphics anti-aliasing
      assignment_delimiter: equals
    flags:
    - name: quiet
      cli: "-q"
      description: Quiet mode
      default: false
      assignment_delimiter: none
    - name: batch
      cli: "-dBATCH"
      description: Batch mode
      default: true
      assignment_delimiter: none
    - name: no_pause
      cli: "-dNOPAUSE"
      description: No pause
      default: true
      assignment_delimiter: none
    - name: no_screen
      cli: "-dNOSAFER"
      description: No safety features
      default: true
      assignment_delimiter: none
    name: convert
- name: windows
  platforms:
  - windows
  shells:
  - bash
  - powershell
  - windows
  option_style: single_dash_space
  executable_name: gswin64c
  commands: []
