---
ukiryu_schema: '1.0'
name: grep
interface: grep

implementations:
  - name: gnu
    display_name: GNU grep
    homepage: https://www.gnu.org/software/grep/
    detection:
      executable: grep
      command: ["--version"]
      pattern: "grep (GNU grep) ([0-9.]+)"
    version_scheme: semantic
    versions:
      - equals: "3.12"
        file: "3.12.yaml"
      - after: "3.12"
        file: "3.12.yaml"
    default: "3.12.yaml"

  - name: busybox
    display_name: BusyBox grep
    homepage: https://busybox.net/
    detection:
      executable: grep
      command: ["--help"]
      pattern: "BusyBox v([0-9.]+)"
    version_scheme: semantic
    versions:
      - equals: "1.36.1"
        file: "1.36.1.yaml"
      - after: "1.35.0"
        file: "1.36.1.yaml"
    default: "1.36.1.yaml"
