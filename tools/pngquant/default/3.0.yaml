---
ukiryu_schema: '1.0'
name: pngquant
display_name: pngquant - PNG lossy compression
homepage: https://pngquant.org/
version: '3.0'
aliases: []
version_detection:
  command: "--version"
  pattern: "(\\d+\\.\\d+)"
  modern_threshold: '3.0'
search_paths:
implements: pngquant/1.0
execution_profiles:
- name: default
  platforms:
  - macos
  - linux
  - windows
  shells:
  - bash
  - zsh
  - fish
  - sh
  - powershell
  - windows
  option_style: double_dash_space
  executable_name: pngquant
  commands:
  - name: compress
    display_name: Compress PNG
    description: Compress PNG with lossy compression
    usage: pngquant [options] input.png [output.png]
    arguments:
    - name: inputs
      type: file
      variadic: true
      min: 1
      position: last
      description: Input PNG files
    options:
    - name: quality
      cli: "--quality"
      description: Min-max quality (0-100)
    - name: speed
      cli: "--speed"
      type: integer
      range:
      - 1
      - 11
      description: Speed/quality tradeoff (1=slow, 11=fast)
    - name: output
      cli: "--output"
      short: "-o"
      description: Output filename
    - name: ext
      cli: "--ext"
      description: Output extension
    - name: no_fs
      cli: "--nofs"
      type: boolean
      description: Disable Floyd-Steinberg dithering
    - name: posterize
      cli: "--posterize"
      type: integer
      description: Posterize to n bits
    - name: strip
      cli: "--strip"
      type: boolean
      description: Remove metadata
    flags:
    - name: force
      cli: "--force"
      short: "-f"
      description: Force overwrite
    - name: skip_if_larger
      cli: "--skip-if-larger"
      type: boolean
      description: Skip if output would be larger
    - name: help
      cli: "--help"
      short: "-h"
      description: Show help
