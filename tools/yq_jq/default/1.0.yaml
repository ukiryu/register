---
ukiryu_schema: '1.0'
name: yq_jq
display_name: yq-jq (JQ wrapper for YAML)
homepage: https://github.com/kislyuk/yq
version: '1.0'
aliases:
- yq
version_detection:
  command: "--version"
  pattern: "^yq (.+)$"
  modern_threshold: '1.0'
search_paths:
implements: yq_jq/1.0
execution_profiles:
- name: unix
  platforms:
  - macos
  - linux
  shells:
  - bash
  - zsh
  - sh
  - fish
  option_style: double_dash_space
  executable_name: yq_jq
  commands:
  - description: Evaluate expression on YAML/JSON input
    usage: yq [options] expression [files...]
    arguments:
    - name: expression
      type: string
      required: true
      position: 1
      description: jq expression to evaluate
    - name: inputs
      type: file
      variadic: true
      min: 0
      position: last
      description: 'Input file(s) (default: stdin)'
    flags:
    - name: raw_output
      cli: "-j"
      description: Output raw JSON strings
      default: false
    - name: help
      cli: "-h"
      description: Show help
      default: false
    name: eval
- name: windows
  platforms:
  - windows
  shells:
  - bash
  - powershell
  - windows
  option_style: single_dash_space
  executable_name: yq_jq
  commands: []
