---
ukiryu_schema: '1.0'
name: wget
interface: wget/1.0

implementations:
  - name: gnu
    display_name: GNU wget
    homepage: https://www.gnu.org/software/wget/
    detection:
      executable: wget
      command: ["--version"]
      pattern: "GNU Wget ([0-9.]+)"
    version_scheme: semantic
    versions:
      - equals: "1.24"
        file: "1.24.yaml"
      - after: "1.24"
        file: "1.24.yaml"
    default: "1.24.yaml"

  - name: busybox
    display_name: BusyBox wget
    homepage: https://busybox.net/
    detection:
      executable: wget
      command: ["--version"]
      pattern: "BusyBox v([0-9.]+)"
    version_scheme: semantic
    versions:
      - equals: "1.36.1"
        file: "1.36.1.yaml"
      - after: "1.35.0"
        file: "1.36.1.yaml"
    default: "1.36.1.yaml"
