---
ukiryu_schema: '1.0'
name: sed
interface: sed

implementations:
  - name: gnu
    display_name: GNU sed
    homepage: https://www.gnu.org/software/sed/
    detection:
      executable: sed
      command: ["--version"]
      pattern: "sed (GNU sed) ([0-9.]+)"
    version_scheme: semantic
    versions:
      - equals: "4.9"
        file: "4.9.yaml"
      - after: "4.9"
        file: "4.9.yaml"
    default: "4.9.yaml"

  - name: busybox
    display_name: BusyBox sed
    homepage: https://busybox.net/
    detection:
      executable: sed
      command: ["--help"]
      pattern: "BusyBox v([0-9.]+)"
    version_scheme: semantic
    versions:
      - equals: "1.36.1"
        file: "1.36.1.yaml"
      - after: "1.35.0"
        file: "1.36.1.yaml"
    default: "1.36.1.yaml"
