---
ukiryu_schema: '1.0'
name: bzip2
version: '1.0.6'
interface: bzip2
implementation: gnu

profiles:
  - name: default
    platforms: [macos, linux]
    shells: [unix]
    commands:
      - name: compress
        execute: ["bzip2"]
        description: "Compress file"
      - name: decompress
        execute: ["bzip2", "-d"]
        description: "Decompress file"
