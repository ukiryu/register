---
ukiryu_schema: '1.0'
name: tar
version: '1.35'
interface: tar
implementation: gnu

profiles:
  - name: default
    platforms: [macos, linux]
    shells: [unix]
    commands:
      - name: create
        execute: ["tar", "cvf"]
        description: "Create a tar archive"
      - name: extract
        execute: ["tar", "xvf"]
        description: "Extract a tar archive"
      - name: list
        execute: ["tar", "tvf"]
        description: "List contents of a tar archive"
