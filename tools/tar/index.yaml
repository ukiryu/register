---
ukiryu_schema: '1.0'
name: tar
interface: tar

implementations:
  - name: gnu
    display_name: GNU tar
    homepage: https://www.gnu.org/software/tar/
    detection:
      executable: tar
      command: ["--version"]
      pattern: "tar (GNU tar) ([0-9.]+)"
    version_scheme: semantic
    versions:
      - equals: "1.35"
        file: "1.35.yaml"
      - after: "1.35"
        file: "1.35.yaml"
    default: "1.35.yaml"

  - name: busybox
    display_name: BusyBox tar
    homepage: https://busybox.net/
    detection:
      executable: tar
      command: ["--help"]
      pattern: "BusyBox v([0-9.]+)"
    version_scheme: semantic
    versions:
      - equals: "1.36.1"
        file: "1.36.1.yaml"
      - after: "1.35.0"
        file: "1.36.1.yaml"
    default: "1.36.1.yaml"
