---
ukiryu_schema: '1.0'
name: dwebp
display_name: dwebp - WebP decoder
homepage: https://developers.google.com/speed/webp/docs/dwebp
version: '1.0'
aliases: []
version_detection:
  command: "-version"
  pattern: "(\\d+\\.\\d+\\.\\d+)"
search_paths:
implements: dwebp/1.0
execution_profiles:
- name: default
  platforms:
  - macos
  - linux
  - windows
  shells:
  - bash
  - zsh
  - fish
  - sh
  - powershell
  - cmd
  option_style: single_dash_space
  executable_name: dwebp
  commands:
  - name: decode
    display_name: Decode WebP
    description: Decode WebP to other format
    usage: dwebp [options] input.webp output.png
    arguments:
    - name: input
      type: file
      required: true
      position: 1
      description: Input WebP file
    - name: output
      type: file
      required: true
      position: last
      description: Output file
    options:
    - name: output_format
      cli: "-outputfmt"
      description: Output format (png, pam, ppm, pgm)
    - name: alpha
      cli: "-alpha"
      description: Preserve alpha channel
    - name: no_fancy
      cli: "-nofancy"
      description: Use fast upscaling
    - name: mt
      cli: "-mt"
      type: boolean
      description: Multi-threading
    - name: quiet
      cli: "-quiet"
      description: Suppress output
    flags:
    - name: help
      cli: "-h"
      short: "-long"
      description: Show help
