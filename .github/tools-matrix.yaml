---
# Tool installation matrix for Ukiryu register validation
# Defines how to install each tool on different platforms
#
# Structure:
#   tool_name:
#     platforms:
#       ubuntu: [apt/apt-get packages or commands]
#       macos: [brew packages or commands]
#       windows: [choco commands or scoop commands]

imagemagick:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y imagemagick
    macos:
      - brew install imagemagick
    windows:
      - choco install imagemagick --yes

ghostscript:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y ghostscript
    macos:
      - brew install ghostscript
    windows:
      - choco install ghostscript --yes

ffmpeg:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y ffmpeg
    macos:
      - brew install ffmpeg
    windows:
      - choco install ffmpeg --yes

pandoc:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y pandoc
    macos:
      - brew install pandoc
    windows:
      - choco install pandoc --yes

inkscape:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y inkscape
    macos:
      - brew install --cask inkscape
    windows:
      - choco install inkscape --yes

yq:
  platforms:
    ubuntu:
      - snap install yq
      - sudo snap install yq  # Ensure snap path is available
    macos:
      - brew install yq
    windows:
      - choco install yq --yes

jpegoptim:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y jpegoptim
    macos:
      - brew install jpegoptim
    windows:
      - echo "jpegoptim not available on Windows"

optipng:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y optipng
    macos:
      - brew install optipng
    windows:
      - echo "optipng not available on Windows"

# Standard Unix utilities (usually pre-installed)
coreutils:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y coreutils
    macos:
      - brew install coreutils
    windows:
      - echo "coreutils utilities not applicable on Windows"

busybox:
  platforms:
    ubuntu:
      - sudo apt-get update -qq
      - sudo apt-get install -y busybox
    macos:
      - brew install busybox
    windows:
      - echo "busybox not available on Windows"

# Archive and compression tools
