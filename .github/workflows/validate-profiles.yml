# frozen_string_literal: true

name: Validate Tool Profiles

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'tools/**/*.yaml'
      - '.github/workflows/*.yml'
  push:
    branches: [v1]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          # windows-11-arm excluded: nokogiri has no precompiled binary for aarch64-mingw-ucrt
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout schemas repository
        uses: actions/checkout@v6
        with:
          repository: ukiryu/schemas
          path: schemas
          ref: main

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: ukiryu-${{ github.sha }}

      - name: Validate YAML syntax
        continue-on-error: true
        run: bundle exec ruby .github/scripts/validate_yaml_syntax.rb

      - name: Install and verify tools
        shell: bash
        env:
          UKIRYU_REGISTER: ${{ github.workspace }}
        run: |
          echo "=========================================="
          echo "Installing and verifying tools for ${{ matrix.os }}"
          echo "=========================================="
          echo ""

          bundle exec ruby .github/scripts/install_tools.rb \
            --verify \
            --fail-on-missing \
            --report-format json,markdown \
            --verbose

          echo ""
          echo "=========================================="
          echo "Tool installation and verification complete"
          echo "=========================================="

      - name: Upload tool verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-verification-report-${{ matrix.os }}
          path: |
            tool_verification_report.json
            tool_verification_report.md
          retention-days: 30

      - name: Validate tool profiles
        shell: bash
        env:
          SCHEMA_PATH: ${{ github.workspace }}/schemas/v1/tool.schema.yaml
          DEBUG_SCHEMA_VALIDATION: "1"
          UKIRYU_REGISTER: ${{ github.workspace }}
        run: |
          echo "=========================================="
          echo "Validating tool profiles on ${{ matrix.os }}"
          echo "Platform: $(uname -s) $(uname -m)"
          echo "Shell: $SHELL"
          echo "Schema: $SCHEMA_PATH"
          echo "=========================================="
          echo ""

          # Skip ukiryu validation on Windows due to path handling issue
          # The install_tools.rb script already validates tool functionality
          if [[ "${{ matrix.os }}" == "windows-"* ]]; then
            echo "Skipping ukiryu validate on Windows (path handling issue)"
            echo "Tool validation was already performed by install_tools.rb"
          else
            # Run comprehensive validation using ukiryu
            # This validates:
            # 1. YAML syntax
            # 2. Schema compliance
            # 3. Tool existence on platform
            # 4. Version detection
            # 5. Smoke test execution
            bundle exec ukiryu validate all \
              --register "${{ github.workspace }}" \
              --schema "$SCHEMA_PATH" \
              --all \
              --executable \
              --verbose || exit 1
          fi

          echo ""
          echo "=========================================="
          echo "All profiles validated successfully on ${{ matrix.os }}"
          echo "=========================================="
